services:
  api:
    build: .
    container_name: smart-recruiter-api
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      SMART_RECRUITER_API_BASE_URL: http://api:8000
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      SMART_RECRUITER_API_KEY: ${SMART_RECRUITER_API_KEY:-change-me}
      API_KEY_HEADER: ${API_KEY_HEADER:-X-Smart-Recruiter-Key}
      DATA_BACKEND: ${DATA_BACKEND:-artifacts}
      ALLOW_ARTIFACT_FALLBACK: ${ALLOW_ARTIFACT_FALLBACK:-true}
      MATCHING_MODE: ${MATCHING_MODE:-artifact}
      LIVE_MATCHING_TOP_N: ${LIVE_MATCHING_TOP_N:-50}
      LIVE_MATCHING_TOP_K: ${LIVE_MATCHING_TOP_K:-5}
      FAISS_INDEX_PATH: ${FAISS_INDEX_PATH:-data/indexes/faiss/cv_index.faiss}
      FAISS_ID_MAP_PATH: ${FAISS_ID_MAP_PATH:-data/indexes/faiss/id_map.pkl}
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: talent_intelligence
      MONGODB_COLLECTION: profiles
      MONGODB_CANDIDATES_COLLECTION: candidates
      MONGODB_CANDIDATE_PROFILES_COLLECTION: candidate_profiles
      MONGODB_JOB_PROFILES_COLLECTION: job_profiles
      MONGODB_MATCHING_RUNS_COLLECTION: matching_runs
      MONGODB_DECISION_CARDS_COLLECTION: decision_cards
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
    depends_on:
      neo4j:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  streamlit:
    build: .
    container_name: smart-recruiter-streamlit
    command: streamlit run ui/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      SMART_RECRUITER_API_BASE_URL: http://api:8000
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      SMART_RECRUITER_API_KEY: ${SMART_RECRUITER_API_KEY:-change-me}
      API_KEY_HEADER: ${API_KEY_HEADER:-X-Smart-Recruiter-Key}
    depends_on:
      api:
        condition: service_healthy

  neo4j:
    image: neo4j:5-community
    container_name: smart-recruiter-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 60s

  mongodb:
    image: mongo:7
    container_name: smart-recruiter-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  neo4j_data:
  mongodb_data:
